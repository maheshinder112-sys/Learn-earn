<style>
:root{--bg:#f4f7fc;--ink:#0b1f4d;--card:#fff;--line:#dbe3f1;--muted:#5a6b8c;--navy:#0b2a6f;--blue:#1d4ed8;--acc:#0b2a6f;--hov:#eef3ff;--g1:#eaf0ff;--g2:#fff;--hd:rgba(255,255,255,.92);--bg2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b1226;--ink:#e8eefc;--card:#131d3a;--line:#26335a;--muted:#9aa9cc;--navy:#9db8ff;--acc:#2563eb;--hov:#1a2650;--g1:#101a3a;--g2:#0b1226;--hd:rgba(11,18,38,.92);--bg2:#0b1226}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:linear-gradient(180deg,var(--g1),var(--g2) 480px),var(--bg2)}
body{margin:0;background:none;color:var(--ink);font-family:'Poppins',system-ui,sans-serif;line-height:1.55}
h1,h2,h3,.logo,.price,.stat{font-family:'Poppins',system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}
.logo{font-size:22px;font-weight:800;cursor:pointer;color:var(--navy);display:inline-flex;align-items:center;gap:8px}.logo .lg{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none}.logo span{white-space:nowrap}@media(max-width:380px){.logo{font-size:19px}.logo .lg{width:36px;height:36px}}.lgb{display:block;width:84px;height:84px;border-radius:50%;margin:0 auto 10px}.hw{display:flex;align-items:center;gap:8px;min-width:0}@media(max-width:760px){header.dh .hw{display:contents}header.dh .logo{margin-left:auto}}.dfoot{padding:4px 20px}.dfl{display:flex;align-items:center;justify-content:center;gap:8px;max-width:420px;margin:0 auto;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--ink);font-weight:600;cursor:pointer;background:var(--card)}.ib{width:42px;height:42px;flex:none;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#e8c65a;background:linear-gradient(145deg,rgba(212,175,55,.2),rgba(212,175,55,.05));border:1px solid rgba(212,175,55,.5);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .15s ease,box-shadow .25s ease,background-color .25s ease,color .25s ease}.ib:active{transform:scale(.92)}.ib svg{display:block}:root:not([data-theme="dark"]) .ib{color:#8a6a14;background:linear-gradient(145deg,#fffdf4,#f6ecc9);border-color:rgba(184,137,43,.55);box-shadow:0 4px 12px rgba(138,106,20,.18),inset 0 1px 0 #fff}#nl{display:none}@media(max-width:760px){#nl{display:block}}.xbtn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn{border:0;background:linear-gradient(135deg,#0b2a6f,#1d4ed8);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;box-shadow:0 6px 16px #0b2a6f33;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1.5px solid var(--navy);color:var(--navy);box-shadow:none}
.btn.sm{padding:8px 16px;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:0 20px 40px}
.hero{position:relative;padding:48px 0 28px}
.hero h1{font-size:clamp(42px,11vw,84px);font-weight:800;letter-spacing:-.03em}
.grad{background:linear-gradient(90deg,#0b2a6f,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:38ch;color:var(--muted);font-size:19px;margin:16px 0 24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 44px}
.stats div{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px}
.stat{font-size:28px;font-weight:800}.stats span{color:var(--muted);font-size:13px}
h2.sec{font-size:clamp(26px,6vw,38px);margin:8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-shadow:0 6px 20px rgba(11,42,111,.06)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--g,linear-gradient(90deg,#0b2a6f,#2563eb))}
.ic{width:52px;height:52px;border-radius:14px;background:var(--g);display:grid;place-items:center;font-size:26px}
.badge{position:absolute;top:16px;right:16px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.off{align-self:flex-start;background:#e6f7ee;color:#0a7a44;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.price{font-size:34px;font-weight:800;color:var(--navy)}.price s{font-size:16px;font-weight:500;color:var(--muted)}
.mut{color:var(--muted)}
.back{background:none;border:0;color:var(--navy);font-weight:700;padding:0;margin:24px 0 14px;text-decoration:underline}
ul{padding-left:20px;margin:8px 0 16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:52px 0 12px}
details{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 18px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:var(--muted);font-size:14px;background:var(--card)}
label{display:block;font-weight:700;margin-top:12px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
.box{max-width:440px;margin-top:32px}
.err{color:#d1274b;font-weight:700}.ok{color:#0a8f4f;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.tabs .chip{white-space:nowrap}
.pro{text-align:center;align-items:center}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0b2a6f,#3b82f6);border:3px solid #dbe3f1}
.act{display:inline-flex;gap:6px;align-items:center;background:#e6f7ee;color:#0a7a44;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.act i{width:9px;height:9px;border-radius:50%;background:#16a34a;display:inline-block}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.earn{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.earn .card{padding:18px}.earn .stat{font-size:clamp(24px,7vw,36px)}
.big{background:linear-gradient(135deg,#0b2a6f,#2563eb)!important;color:#fff;border:0}
.big span,.big .stat{color:#fff}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ld{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.sp{width:64px;height:64px;border-radius:50%;border:6px solid var(--line);border-top-color:#1d4ed8;border-right-color:#0b2a6f;animation:spin .9s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:2.5s}}
.dl{display:flex;gap:22px;align-items:flex-start;margin-top:18px}
.sb{width:220px;flex:none;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sb button{text-align:left;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:10px;font-weight:600}
.sb button:hover{background:var(--hov)}.sb button.on{background:var(--acc);color:#fff}
.mn{flex:1;min-width:0}
.mt,.ov{display:none}
@media (max-width:760px){.mt{display:inline-block;margin-top:14px}
.sb{position:fixed;left:0;top:0;bottom:0;z-index:20;width:250px;border-radius:0 18px 18px 0;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .25s}
.sb.open{transform:none}.ov.open{display:block;position:fixed;inset:0;background:rgba(11,31,77,.45);z-index:19}
.dl{margin-top:8px}}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px auto;width:max-content}



.hb{display:flex;flex-direction:column;gap:12px;max-width:340px}.hb .btn{text-align:center;padding:15px 22px}
.sb button.lo{color:#d1274b;font-weight:700;margin-top:8px;border-top:1px solid var(--line);border-radius:0 0 10px 10px}.sb button.lo:hover{background:rgba(209,39,75,.1)}
img.av{object-fit:cover;display:block}
label.btn{display:inline-block;cursor:pointer;margin:0}.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.md{position:fixed;inset:0;z-index:60;background:rgba(11,31,77,.6);display:grid;place-items:center;padding:16px;overflow:auto}.mdc{width:min(100%,360px);align-items:center;gap:14px}#ec{width:100%;max-width:280px;aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;border:3px solid var(--line)}.mdc input[type=range]{padding:0;border:0}
:root{}
:root[data-theme="dark"]{}
:root[data-theme="dark"] .grad{background:linear-gradient(90deg,#60a5fa,#b6ccff);-webkit-background-clip:text;background-clip:text;color:transparent}

body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:max(46vh,calc(100vw*.5));max-height:640px;background:var(--hbg) center bottom/cover no-repeat;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%);mask-image:linear-gradient(to bottom,transparent,#000 40%)}
.mp{display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border-bottom:1px solid var(--line);padding:6px 20px 18px;flex-direction:column;box-shadow:0 14px 28px rgba(11,42,111,.14)}
.mp.open{display:flex}.mp .mi{background:none;border:0;text-align:left;font-size:18px;padding:14px 0;color:var(--ink);border-bottom:1px solid var(--line)}.mp .btn{margin-top:14px;width:100%}
#mb{display:inline-flex;align-items:center;justify-content:center}
.mdc .li{width:100%}
.lb.top{border-bottom:0;border-radius:12px;padding:12px 10px;margin-bottom:6px}.lb.t1{background:linear-gradient(90deg,rgba(245,185,20,.30),transparent)}.lb.t2{background:linear-gradient(90deg,rgba(148,163,184,.32),transparent)}.lb.t3{background:linear-gradient(90deg,rgba(205,127,50,.30),transparent)}
.fl{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-bottom:10px}.fl a{color:var(--navy);text-decoration:none;font-weight:600}.fl a:hover{text-decoration:underline}
.ph{background:#fff3b0;color:#5a4300;padding:1px 6px;border-radius:6px;font-weight:700}
.tsec{scroll-margin-top:90px}.tsec h3{margin:26px 0 8px}.tsec p{margin:0 0 10px;max-width:760px}
.toc{columns:2 240px;margin-top:8px}.toc a{display:block;padding:5px 0;color:var(--navy);text-decoration:none;font-weight:600}

.tov{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0}
.vip{display:inline-block;background:linear-gradient(90deg,#ff2d55,#b0002a);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:.05em;filter:drop-shadow(0 0 5px rgba(255,45,85,.45))}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:capitalize}.st.active{background:#e6f7ee;color:#0a7a44}.st.pending{background:#fff3b0;color:#5a4300}.st.suspended{background:#fde2e8;color:#b0002a}
.vipbox{background:radial-gradient(120% 110% at 50% 0%,#2e0b14 0%,#0c0b0d 55%,#000 100%);border:1px solid rgba(212,175,55,.4);border-radius:24px;padding:46px 22px 34px;text-align:center;color:#f3e3bd;box-shadow:0 22px 50px rgba(0,0,0,.35),inset 0 0 44px rgba(255,45,85,.08)}
.vlock{width:70px;height:70px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:#d4af37;border:1.5px solid rgba(212,175,55,.6);background:rgba(212,175,55,.08)}
.vt{font-family:'Poppins',sans-serif;font-size:60px;font-weight:800;letter-spacing:.22em;padding-left:.22em;background:linear-gradient(180deg,#f7e7a8,#b8892b);-webkit-background-clip:text;background-clip:text;color:transparent}
.vs{display:inline-block;margin:6px 0 10px;padding:6px 18px;border-radius:999px;border:1px solid rgba(255,45,85,.6);color:#ff6b86;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.vipbox p{margin:6px auto 0;max-width:30ch;color:#cdbb92}.vb{margin-top:14px;color:#ff6b86;font-weight:700}
.vsk{height:44px;border-radius:12px;margin:14px auto 0;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));filter:blur(2.5px)}
/* ===== modern motion + polish ===== */
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes gmove{to{background-position:220% 0}}
@keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-22px) scale(1.08)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 8px rgba(37,99,235,0)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}}
@keyframes marq{to{transform:translateX(-50%)}}
#app{animation:pageIn .45s ease}
.hero{isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(64px);opacity:.5;pointer-events:none}
.hero::before{width:260px;height:260px;right:-60px;top:-30px;background:#3b82f6;animation:floaty 9s ease-in-out infinite}
.hero::after{width:200px;height:200px;left:-70px;bottom:10px;background:#22d3ee;animation:floaty 11s ease-in-out infinite reverse}
:root[data-theme="dark"] .hero::before{background:#2563eb;opacity:.4}:root[data-theme="dark"] .hero::after{background:#7c3aed;opacity:.35}
.grad{background-image:linear-gradient(90deg,#0b2a6f,#2563eb,#38bdf8,#2563eb,#0b2a6f);background-size:220% 100%;animation:gmove 7s linear infinite}
:root[data-theme="dark"] .grad{background-image:linear-gradient(90deg,#7aa2ff,#38bdf8,#c4b5fd,#38bdf8,#7aa2ff)}
header{transition:box-shadow .3s}header.sc{box-shadow:0 10px 30px rgba(11,42,111,.14)}
.btn{position:relative;overflow:hidden;border-radius:999px;box-shadow:0 10px 24px rgba(37,99,235,.3);transition:transform .2s,box-shadow .25s}
.btn.ghost{box-shadow:none}
.btn::after{content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .7s ease;pointer-events:none}
.btn:hover::after{left:150%}.btn:active{transform:scale(.96)}
.card{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;border-radius:22px}
.ic{transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
@media (hover:hover){
 .grid>.card:hover,.earn>.card:hover,.steps>.card:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(11,42,111,.18);border-color:rgba(37,99,235,.4)}
 .grid>.card:hover .ic{transform:rotate(-7deg) scale(1.1)}}
.badge{animation:pulse 2.4s infinite}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.vis{opacity:1;transform:none}
.card svg rect{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.card svg rect:nth-of-type(2){animation-delay:.06s}.card svg rect:nth-of-type(3){animation-delay:.12s}.card svg rect:nth-of-type(4){animation-delay:.18s}.card svg rect:nth-of-type(5){animation-delay:.24s}.card svg rect:nth-of-type(6){animation-delay:.3s}.card svg rect:nth-of-type(7){animation-delay:.36s}
.mp.open{animation:drop .25s ease}.md{animation:fade .2s ease}.mdc{animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.sb button{transition:background .2s,color .2s,transform .2s}.sb button:hover{transform:translateX(3px)}
.rib{overflow:hidden;margin:4px -20px 28px;padding:14px 0;border-block:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.rt{display:flex;gap:34px;width:max-content;animation:marq 30s linear infinite}.rib:hover .rt{animation-play-state:paused}
.rt span{font-weight:700;color:var(--navy);white-space:nowrap}.rt span::after{content:"✦";margin-left:34px;opacity:.45}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}}

/* ---- modern motion layer ---- */
.hero{isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(34px)}
.hero::before{width:340px;height:340px;right:-90px;top:-40px;background:radial-gradient(circle,rgba(56,189,248,.5),transparent 65%);animation:fl1 9s ease-in-out infinite}
.hero::after{width:300px;height:300px;left:-90px;top:150px;background:radial-gradient(circle,rgba(99,102,241,.4),transparent 65%);animation:fl2 11s ease-in-out infinite}
@keyframes fl1{50%{transform:translate(-30px,40px) scale(1.12)}}
@keyframes fl2{50%{transform:translate(40px,-30px) scale(1.1)}}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.28);color:var(--navy);font-weight:700;font-size:13px;margin-bottom:14px}
.pill i{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}

.vipb{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#d4af37;border:1px solid rgba(212,175,55,.6);border-radius:999px;padding:2px 10px;margin-top:5px;background:rgba(212,175,55,.1)}
.vtick{flex:none;display:inline-flex;width:18px;height:18px;border-radius:50%;background:#d4af37;color:#111;font-size:10px;font-weight:900;align-items:center;justify-content:center}
.sb button.uv{background:linear-gradient(90deg,#8b5cf6,#d946ef,#a78bfa,#8b5cf6);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;animation:uvs 4s linear infinite;text-shadow:0 0 18px rgba(168,85,247,.35)}
.sb button.uv.on{background:linear-gradient(90deg,#6d28d9,#a21caf);-webkit-background-clip:border-box;background-clip:border-box;color:#fff;animation:none;box-shadow:0 0 16px rgba(168,85,247,.45);text-shadow:none}
@keyframes uvs{to{background-position:-250% 0}}
@media(prefers-reduced-motion:reduce){.sb button.uv{animation:none}}
.pc{padding:0!important;overflow:hidden;margin-bottom:16px;text-align:left;display:block!important}
.pch{padding:18px 20px;border-bottom:1px solid var(--line)}.pch h3{margin:0 0 4px}.pch p{margin:0}
.pban{height:86px;background:linear-gradient(120deg,#2a1f04,#9c7414 50%,#e8c766);position:relative}.pban .act{position:absolute;right:14px;top:14px}
.pbd{padding:0 20px 20px}
.pava{position:relative;width:106px;height:106px;margin-top:-53px;border-radius:50%;padding:5px;background:var(--card)}
.pava .av,.pava .tav{width:96px!important;height:96px!important;margin:0!important;font-size:34px!important;border-radius:50%;border:0}
.pcam{position:absolute;right:0;bottom:4px;width:38px;height:38px;border-radius:50%;background:#111;color:#fff;border:2px solid #d4af37;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.pcam svg{width:18px;height:18px}
.pnm{margin:12px 0 6px;font-size:20px;word-break:break-word}
.pln{display:flex;align-items:center;gap:8px;color:var(--muted);margin:5px 0;word-break:break-all}.pln svg{width:18px;height:18px;flex:none}
.rcb{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;background:var(--hov)}.rcb span{display:block;font-size:12px;letter-spacing:.08em}.rcb b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:.04em;word-break:break-all}
.pc label{display:block;margin-top:14px;font-weight:600}
.ifl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);margin-top:6px}.ifl:focus-within{border-color:#d4af37}.ifl>svg{width:18px;height:18px;color:var(--muted);flex:none}
.ifl input{border:0!important;background:transparent!important;box-shadow:none!important;margin:0!important;padding:13px 0!important;flex:1;min-width:0;outline:none}
.eye{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;display:flex}.eye svg{width:18px;height:18px}
.ifl input[readonly]{color:var(--muted)!important;cursor:default}.bic svg{width:17px;height:17px;vertical-align:-3px}
.sb button{display:flex;align-items:center;gap:12px;font-weight:600;transition:background-color .2s,color .2s}
.sbi{width:34px;height:34px;flex:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:rgba(212,175,55,.1);color:#d4af37;transition:background-color .2s,color .2s}.sbi svg{width:18px;height:18px}
:root:not([data-theme="dark"]) .sbi{background:rgba(212,175,55,.15);color:#8a6a14}
.sb button:not(.on):hover{background:var(--hov)}
.sb button.on .sbi{background:rgba(0,0,0,.16);color:#1a1300}
.sb button.uv .sbi{background:rgba(168,85,247,.15);color:#c084fc}.sb button.uv.on .sbi{background:rgba(255,255,255,.18);color:#fff}
.sb .lo .sbi{background:rgba(209,39,75,.12);color:#e0445f}
</style>

function termsV(){app.innerHTML=(FD&&cur?'<button class="back" onclick="go(\'dash\')">← Back</button>':BK)+`<h2 class="sec" id="terms-top" style="margin-top:0">Terms &amp; Policies</h2><p class="mut" style="max-width:720px;margin-top:-6px">These policies explain the rules and conditions for using this platform, buying courses and products, taking part in the affiliate and referral program, and using the website's services.</p><p class="mut" style="margin:0 0 16px">Effective date: ${ph('INSERT EFFECTIVE DATE')}</p><div class="card" style="margin-bottom:8px"><b>Contents</b><div class="toc">${TS.map((s,i)=>`<a href="#" onclick="openT('${s[0]}');return false">${i+1}. ${s[1].replace('&','&amp;')}</a>`).join('')}</div></div>${TS.map((s,i)=>`<section class="tsec" id="${s[0]}"><h3>${i+1}. ${s[1].replace('&','&amp;')}</h3>${s[2].map(p=>`<p>${p}</p>`).join('')}</section>`).join('')}`}
function openT(id){if(view!=='terms')go('terms');setTimeout(()=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth'})},80)}
const BK='<button class="back" onclick="go(\'home\')">← Back</button>';
const HAM='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';const XI='<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';const SUN='<svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>';const MOON='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/></svg>';
const SLUG=['marketing','branding','traffic','influence','finance'];
const TTL={courses:'Courses',about:'About Us',contact:'Contact',in:'Login',up:'Sign Up',terms:'Terms & Policies',ck:'Checkout',dash:'Dashboard'};
function pathFor(){const m={home:'/',courses:'/courses',about:'/about',contact:'/contact',in:'/login',up:'/signup',terms:'/terms',dash:'/dashboard'};if(view==='course')return '/courses/'+SLUG[sel];if(view==='ck')return '/buy/'+SLUG[sel];return m[view]||'/'}
function setTitle(){const t=view==='course'?COURSES[sel].n:TTL[view];document.title=(t?t+' | ':'')+'Learn and Earn'}
function pushU(){setTitle();const p=pathFor();try{if(location.pathname!==p)history.pushState(null,'',p)}catch(e){}}
function fromURL(){const p=(location.pathname.replace(/\/+$/,'')||'/').toLowerCase(),M={'/':'home','/courses':'courses','/about':'about','/contact':'contact','/login':'in','/signup':'up','/terms':'terms','/dashboard':'dash'};if(M[p])return{v:M[p]};const m=p.match(/^\/(courses|buy)\/([a-z]+)$/);if(m&&SLUG.includes(m[2]))return{v:m[1]==='buy'?'ck':'course',sel:SLUG.indexOf(m[2])};return{v:'home'}}
addEventListener('popstate',()=>{FD=false;const r=fromURL();mc();view=r.v;if(r.sel!=null)sel=r.sel;setTitle();window.scrollTo(0,0);render()});
function mm(){const p=document.getElementById('mp'),b=document.getElementById('mb'),o=p.classList.toggle('open');b.innerHTML=o?XI:HAM;b.setAttribute('aria-expanded',o)}
function mc(){const p=document.getElementById('mp'),b=document.getElementById('mb');if(p)p.classList.remove('open');if(b){b.innerHTML=HAM;b.setAttribute('aria-expanded','false')}}
function coursesV(){app.innerHTML=BK+`<h2 class="sec" style="margin-top:0">Our Courses</h2><div class="grid">${COURSES.map((c,i)=>`<div class="card" style="--g:${GR[i]};--ac:${COL[i][0]}">${i==2?'<span class="badge">Best seller</span>':''}<div class="cimg">${cpic(i)}</div><h3>${c.n}</h3><span class="off">50% OFF</span><div class="price">${inr(c.p)} <s>${inr(c.p*2)}</s></div><p class="mut" style="margin:0">${c.d}</p>${stat(c)}<button class="btn" onclick="go('course',${i})">View course</button></div>`).join('')}</div>`}
function aboutV(){app.innerHTML=BK+`<h2 class="sec" style="margin-top:0">About Learn and Earn</h2><div class="card" style="max-width:720px"><p style="margin:0">Learn and Earn is a learning platform where you build practical skills in marketing, branding, traffic, influence and finance, and grow your income step by step.</p></div>
<h3 style="margin:28px 0 12px">What you get</h3><div class="card" style="max-width:720px"><ul style="margin:0"><li>5 courses, from Marketing Mastery to Finance Mastery, now at 50% off.</li><li>A beginner to advanced training video series for every new member.</li><li>Your own ID and dashboard with your profile, courses and earnings.</li><li>A personal TRS referral code to build your team.</li><li>A prepaid wallet to recharge and activate accounts for your team.</li></ul></div>
<h3 style="margin:28px 0 12px">How it works</h3><div class="steps" style="margin-top:0"><div class="card" style="--g:${GR[0]}"><h3>1. Join</h3><span class="mut">Create your ID and pick a course.</span></div><div class="card" style="--g:${GR[1]}"><h3>2. Learn</h3><span class="mut">Watch the training videos in My Courses.</span></div><div class="card" style="--g:${GR[3]}"><h3>3. Earn</h3><span class="mut">Share your TRS code and track your earnings on your dashboard.</span></div></div>
<h3 style="margin:28px 0 12px">Our courses</h3><div class="card" style="max-width:720px">${COURSES.map(c=>`<div class="li"><b>${c.n}</b><span>${inr(c.p)}</span></div>`).join('')}</div>`}

function car(){const c=document.querySelector('.carousel');if(!c||c.dataset.on)return;c.dataset.on=1;
const cards=[...c.children],N=cards.length,dots=document.querySelectorAll('.cdots i');let t,rs,best=0,anim=false,touching=false,stopped=false,vis=true;
const ctr=j=>{const b=cards[j].getBoundingClientRect(),r=c.getBoundingClientRect();return c.scrollLeft+(b.left+b.width/2)-(r.left+r.width/2)};
const upd=()=>{const r=c.getBoundingClientRect(),m=r.left+r.width/2;let bi=0,bd=1e9;cards.forEach((el,i)=>{const b=el.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-m),k=Math.max(0,1-d/(r.width*.7));el.style.setProperty('--s',(.92+.08*k).toFixed(3));el.style.opacity=(.6+.4*k).toFixed(2);if(d<bd){bd=d;bi=i}});best=bi;dots.forEach((d,i)=>d.classList.toggle('on',i===best))};
const to=(x,dur)=>{anim=true;c.style.scrollSnapType='none';const x0=c.scrollLeft,t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/dur),e=.5-.5*Math.cos(Math.PI*p);c.scrollLeft=x0+(x-x0)*e;if(p<1&&anim)requestAnimationFrame(f);else{anim=false;c.style.scrollSnapType=''}};requestAnimationFrame(f)};
c.addEventListener('scroll',()=>{cancelAnimationFrame(t);t=requestAnimationFrame(upd)},{passive:true});
const grab=()=>{touching=true;clearTimeout(rs);if(anim){anim=false;c.style.scrollSnapType=''}},free=()=>{clearTimeout(rs);rs=setTimeout(()=>{touching=false},1200)};
c.addEventListener('touchstart',grab,{passive:true});c.addEventListener('touchend',free,{passive:true});c.addEventListener('touchcancel',free,{passive:true});c.addEventListener('wheel',()=>{grab();free()},{passive:true});c.addEventListener('click',()=>{stopped=true});
try{new IntersectionObserver(e=>{vis=e[0].isIntersecting}).observe(c)}catch(e){}
upd();
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const iv=setInterval(()=>{if(!document.body.contains(c)){clearInterval(iv);return}if(stopped||touching||anim||document.hidden||!vis)return;if(best>=N-1)to(0,900);else to(ctr(best+1),600)},2000)}}

const SENT=()=>`<div class="box card" style="position:relative;text-align:center"><button class="xbtn" aria-label="Close" onclick="go('home')">✕</button><div style="font-size:52px">⏳</div><h2>Waiting for approval</h2><p class="mut">Your request has been sent to your sponsor. Your ID will open once they approve it. After that you can sign in.</p></div>`;
async function verify(){const c=v('s').toUpperCase(),r=document.getElementById('vr');try{const d=await api('/verify?code='+encodeURIComponent(c));vf=true;r.className='ok';r.textContent='Valid. Sponsor: '+d.name}catch(e){vf=false;r.className='err';r.textContent='Referral code not found.'}}
async function doUp(){const n=v('n'),e=v('e').toLowerCase(),p=v('p'),w=document.getElementById('w').value,sp=v('s').toUpperCase();
if(!n||!e||!p||!w)return err('Fill in name, email, phone and password.');
if(!/^\S+@\S+\.\S+$/.test(e))return err('Enter a valid email.');
if(p.replace(/\D/g,'').length<10)return err('Enter a 10-digit phone number.');
if(w.length<8)return err('Password needs at least 8 characters.');
if(pick<0)return err('Choose your course.');
if(!ckM)return err('Choose a payment method.');
const c=COURSES[pick];
if(ckM==='wallet'){
if(!sp)return err('TRS code is required for Wallet payment.');
if(!vf)return err('Please verify the TRS code first.');
try{await api('/register','POST',{name:n,email:e,phone:p,password:w,sponsor:sp,pkg:pick,method:'wallet'})}catch(x){return err(x.message)}
app.innerHTML=SENT();return}
try{await api('/available?email='+encodeURIComponent(e));if(sp)await api('/verify?code='+encodeURIComponent(sp))}catch(x){return err(x.message)}
sel=pick;CK={n,e,p,w,sp,pkg:pick};PAY={a:c.p,app:ckApp,done:ckDone};app.innerHTML=payHTML('up()');drawQR();openApp()}

let LG={};

const TABS=[['dash','Dashboard'],['team','My Team'],['aff','Affiliate Links'],['crs','My Courses'],['lead','Leaderboard'],['vip','VIP'],['wal','My Wallet'],['prof','Update Profile'],['mem','Members'],['pay','Verification']];
const nm=x=>esc(x.name)+(x.vip?' <span class="vip">(VIP)</span>':'');
function vipHTML(u){return `<div class="vipbox"><div class="vlock"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div><div class="vt">VIP</div><div class="vs">Coming Soon</div><p>Exclusive features for VIP members are on the way.</p>${u.vip?'<div class="vb">You are a VIP member ✦</div>':''}<div class="vsk"></div><div class="vsk" style="width:80%;margin-left:auto;margin-right:auto"></div><div class="vsk" style="width:60%;margin-left:auto;margin-right:auto"></div></div>`}
function memRows(L){return L.length?L.map(m=>`<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${nm(m)}</b><span class="st ${m.status}">${m.status}</span></div><div class="code" style="justify-content:flex-start">${esc(m.code)}</div><div>${COURSES[m.pkg].n}</div><div class="mut" style="font-size:13px">${esc(m.email)} | ${esc(m.phone)}</div><div class="row"><button class="btn sm ghost" onclick="memAct(${m.id},'vip',${!m.vip})">${m.vip?'Remove VIP':'Make VIP'}</button>${m.status==='active'?`<button class="btn sm ghost" style="border-color:#d1274b;color:#d1274b" onclick="memSus(${m.id})">Suspend</button>`:m.status==='suspended'?`<button class="btn sm" onclick="memAct(${m.id},'suspend',false)">Unsuspend</button>`:''}</div></div>`).join(''):'<div class="card mut">No members found.</div>'}
let mf='all';
function memF(q){return (D.members||[]).filter(m=>m.status!=='rejected'&&(mf==='all'||m.status===mf)&&(m.name+' '+m.email+' '+m.phone+' '+m.code).toLowerCase().includes(q||''))}
function memChips(){const L=(D.members||[]).filter(m=>m.status!=='rejected'),n={pending:L.filter(m=>m.status==='pending').length,active:L.filter(m=>m.status==='active').length,all:L.length};return `<div class="chips" id="mfc" style="margin-top:16px">${[['pending','Pending ID'],['active','Active ID'],['all','All']].map(([k,l])=>`<button class="chip${mf===k?' on':''}" data-k="${k}" onclick="mfs('${k}')">${l} (${n[k]})</button>`).join('')}</div>`}
function mfs(k){mf=k;document.querySelectorAll('#mfc .chip').forEach(b=>b.classList.toggle('on',b.dataset.k===k));mq()}
function mq(){const q=document.getElementById('mq').value.toLowerCase();document.getElementById('ml').innerHTML=memRows(memF(q))}
async function memAct(id,what,on){try{await api('/admin/members/'+id+'/'+what,'POST',{on})}catch(e){alert(e.message)}edClose();dash()}
function memSus(id){const m=(D.members||[]).find(x=>x.id===id);if(!m)return;mo(`<h3>Suspend ${esc(m.name)}?</h3><p class="mut" style="margin:0">They will be signed out and cannot sign in until you unsuspend them.</p><div class="row"><button class="btn ghost sm" onclick="edClose()">Cancel</button><button class="btn sm" onclick="memAct(${id},'suspend',true)">Suspend</button></div>`)}

async function dash(){if(!TOKEN){cur=null;return go('in')}
try{cur=await api('/me');cur.courses=[cur.pkg];
if(tab==='team'||tab==='dash')D.team=await api('/team');
else if(tab==='wal'){const [t,r]=await Promise.all([api('/wallet'),api('/wallet/requests')]);D.txns=t.txns;D.cb=t.cb||[];D.reqs=r}
else if(tab==='lead')D.lead=await api('/leaderboard');
else if(tab==='prof')D.mentor=(await api('/mentor')).mentor;
else if(tab==='mem'&&cur.admin){D.stats=await api('/admin/stats');D.members=await api('/admin/members')}
else if(tab==='pay'&&cur.admin)D.pays=await api('/admin/pays')}

dash0()}
