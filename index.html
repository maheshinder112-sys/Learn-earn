<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn and Earn</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('lae_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#f4f7fc;--ink:#0b1f4d;--card:#fff;--line:#dbe3f1;--muted:#5a6b8c;--navy:#0b2a6f;--blue:#1d4ed8;--acc:#0b2a6f;--hov:#eef3ff;--g1:#eaf0ff;--g2:#fff;--hd:rgba(255,255,255,.92);--bg2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b1226;--ink:#e8eefc;--card:#131d3a;--line:#26335a;--muted:#9aa9cc;--navy:#9db8ff;--acc:#2563eb;--hov:#1a2650;--g1:#101a3a;--g2:#0b1226;--hd:rgba(11,18,38,.92);--bg2:#0b1226}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:linear-gradient(180deg,var(--g1),var(--g2) 480px),var(--bg2)}
body{margin:0;background:none;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.55}
h1,h2,h3,.logo,.price,.stat{font-family:'Bricolage Grotesque','Arial Black',sans-serif;line-height:1.1;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5}
.logo{font-size:22px;font-weight:800;cursor:pointer;color:var(--navy)}
.btn{border:0;background:linear-gradient(135deg,#0b2a6f,#1d4ed8);color:#fff;padding:13px 22px;border-radius:12px;font-weight:700;box-shadow:0 6px 16px #0b2a6f33;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1.5px solid var(--navy);color:var(--navy);box-shadow:none}
.btn.sm{padding:8px 16px;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:0 20px 40px}
.hero{position:relative;padding:48px 0 28px}
.hero h1{font-size:clamp(42px,11vw,84px);font-weight:800;letter-spacing:-.03em}
.grad{background:linear-gradient(90deg,#0b2a6f,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:38ch;color:var(--muted);font-size:19px;margin:16px 0 24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 44px}
.stats div{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px}
.stat{font-size:28px;font-weight:800}.stats span{color:var(--muted);font-size:13px}
h2.sec{font-size:clamp(26px,6vw,38px);margin:8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-shadow:0 6px 20px rgba(11,42,111,.06)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--g,linear-gradient(90deg,#0b2a6f,#2563eb))}
.ic{width:52px;height:52px;border-radius:14px;background:var(--g);display:grid;place-items:center;font-size:26px}
.badge{position:absolute;top:16px;right:16px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.off{align-self:flex-start;background:#e6f7ee;color:#0a7a44;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.price{font-size:34px;font-weight:800;color:var(--navy)}.price s{font-size:16px;font-weight:500;color:var(--muted)}
.mut{color:var(--muted)}
.back{background:none;border:0;color:var(--navy);font-weight:700;padding:0;margin:24px 0 14px;text-decoration:underline}
ul{padding-left:20px;margin:8px 0 16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:52px 0 12px}
details{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 18px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:var(--muted);font-size:14px;background:var(--card)}
label{display:block;font-weight:700;margin-top:12px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
.box{max-width:440px;margin-top:32px}
.err{color:#d1274b;font-weight:700}.ok{color:#0a8f4f;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.tabs .chip{white-space:nowrap}
.pro{text-align:center;align-items:center}
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0b2a6f,#3b82f6);border:3px solid #dbe3f1}
.act{display:inline-flex;gap:6px;align-items:center;background:#e6f7ee;color:#0a7a44;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.act i{width:9px;height:9px;border-radius:50%;background:#16a34a;display:inline-block}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.earn{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.earn .card{padding:18px}.earn .stat{font-size:clamp(24px,7vw,36px)}
.big{background:linear-gradient(135deg,#0b2a6f,#2563eb)!important;color:#fff;border:0}
.big span,.big .stat{color:#fff}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ld{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.sp{width:64px;height:64px;border-radius:50%;border:6px solid var(--line);border-top-color:#1d4ed8;border-right-color:#0b2a6f;animation:spin .9s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:2.5s}}
.dl{display:flex;gap:22px;align-items:flex-start;margin-top:18px}
.sb{width:220px;flex:none;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.sb button{text-align:left;border:0;background:none;color:var(--ink);padding:11px 12px;border-radius:10px;font-weight:600}
.sb button:hover{background:var(--hov)}.sb button.on{background:var(--acc);color:#fff}
.mn{flex:1;min-width:0}
.mt,.ov{display:none}
@media (max-width:760px){.mt{display:inline-block;margin-top:14px}
.sb{position:fixed;left:0;top:0;bottom:0;z-index:20;width:250px;border-radius:0 18px 18px 0;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .25s}
.sb.open{transform:none}.ov.open{display:block;position:fixed;inset:0;background:rgba(11,31,77,.45);z-index:19}
.dl{margin-top:8px}}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;margin:8px auto;width:max-content}



.hb{display:flex;flex-direction:column;gap:12px;max-width:340px}.hb .btn{text-align:center;padding:15px 22px}
.sb button.lo{color:#d1274b;font-weight:700;margin-top:8px;border-top:1px solid var(--line);border-radius:0 0 10px 10px}.sb button.lo:hover{background:rgba(209,39,75,.1)}
img.av{object-fit:cover;display:block}
label.btn{display:inline-block;cursor:pointer;margin:0}.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.md{position:fixed;inset:0;z-index:60;background:rgba(11,31,77,.6);display:grid;place-items:center;padding:16px;overflow:auto}.mdc{width:min(100%,360px);align-items:center;gap:14px}#ec{width:100%;max-width:280px;aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;border:3px solid var(--line)}.mdc input[type=range]{padding:0;border:0}
:root{}
:root[data-theme="dark"]{}
:root[data-theme="dark"] .grad{background:linear-gradient(90deg,#60a5fa,#b6ccff);-webkit-background-clip:text;background-clip:text;color:transparent}

function pay(us,code,amt,why){if(!code||!(amt>0))return;const p=us.find(m=>m.code===code);if(!p)return;p.wallet=(p.wallet||0)+amt;(p.txns=p.txns||[]).push({type:'credit',amt,bal:p.wallet,why,t:Date.now()});(p.ledger=p.ledger||[]).push({d:Date.now(),a:amt})}
function tm(i){return D.team[i]}
function tpv(i){const x=tm(i);if(!x)return;mo(`<h3>Profile</h3><div class="li"><span class="mut">Name</span><b>${nm(x)}</b></div><div class="li"><span class="mut">Registered number</span><b>${esc(x.phone)}</b></div><div class="li"><span class="mut">Package</span><b>${COURSES[x.pkg].n}</b></div><button class="btn sm" onclick="edClose()">Close</button>`)}
function tup(i){const x=tm(i);if(!x)return;const hi=COURSES.map((c,k)=>k).filter(k=>k>x.pkg);
if(!hi.length)return mo(`<h3>Update Profile</h3><p class="mut" style="margin:0">${esc(x.name)} already has the highest package (${COURSES[x.pkg].n}).</p><button class="btn sm" onclick="edClose()">Close</button>`);
mo(`<h3>Upgrade ${esc(x.name)}</h3><p class="mut" style="margin:0;width:100%">Current package: <b>${COURSES[x.pkg].n}</b>. You can only upgrade to a higher package.</p><div style="width:100%">${hi.map(k=>`<div class="li"><div><b>${COURSES[k].n}</b><div class="mut" style="font-size:13px">${inr(DEBIT[k]-DEBIT[x.pkg])} from your wallet</div></div><button class="btn sm" onclick="tcf(${i},${k})">Upgrade</button></div>`).join('')}</div><button class="btn ghost sm" onclick="edClose()">Cancel</button>`)}
function tcf(i,k){const x=tm(i);if(!x||k<=x.pkg)return;const d=DEBIT[k]-DEBIT[x.pkg];mo(`<h3>Confirm upgrade</h3><p style="margin:0">Upgrade <b>${esc(x.name)}</b> from ${COURSES[x.pkg].n} to <b>${COURSES[k].n}</b>?</p><p class="mut" style="margin:0">${inr(d)} will be deducted from your wallet.</p><div class="row"><button class="btn ghost sm" onclick="edClose()">Cancel</button><button class="btn sm" onclick="tdo(${i},${k})">Confirm</button></div>`)}
async function tdo(i,k){const x=tm(i);edClose();if(!x||k<=x.pkg)return;
try{await api('/team/'+x.id+'/upgrade','POST',{pkg:k});mo(`<h3 class="ok">Upgraded</h3><p style="margin:0">${esc(x.name)} is now on ${COURSES[k].n}.</p><button class="btn sm" onclick="edClose();dash()">Done</button>`)}
catch(e){if(/Insufficient/.test(e.message))mo(`<h3>Insufficient balance</h3><p class="mut" style="margin:0">Please recharge your wallet and try again.</p><div class="row"><button class="btn ghost sm" onclick="edClose()">Close</button><button class="btn sm" onclick="edClose();st('wal')">Recharge wallet</button></div>`);else mo(`<h3>Could not upgrade</h3><p class="err" style="margin:0">${esc(e.message)}</p><button class="btn sm" onclick="edClose()">Close</button>`)}}
function edClose(){const d=document.getElementById('md');if(d)d.remove()}
async function edSave(){const o=document.createElement('canvas');o.width=o.height=256;edDraw(o,256/ES);const d=o.toDataURL('image/jpeg',.85);try{await api('/me/avatar','PUT',{data:d});edClose();dash()}catch(e){edClose();perr(e.message)}}
async function rmPic(){try{await api('/me/avatar','DELETE')}catch(e){}dash()}
async function upd(){const n=v('n'),p=v('p');if(!n||!p)return err('Name and phone cannot be empty.');try{await api('/me','PUT',{name:n,phone:p});await load();err('Saved.')}catch(e){err(e.message)}}
async function out(){try{await api('/logout','POST')}catch(e){}TOKEN=false;cur=null;go('home')}
async function forget(){ls('lae_saved',null);try{await api('/logout','POST')}catch(e){}TOKEN=false;cur=null;inn()}
function v(id){return document.getElementById(id).value.trim()}
function err(m){document.getElementById('er').textContent=m}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function theme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('lae_theme',t)}catch(e){}const b=document.getElementById('tb');if(b)b.textContent=t==='dark'?'☀️':'🌙'}
let tbusy=false;
function tt(){if(tbusy)return;const h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';
if(!document.body.animate||matchMedia('(prefers-reduced-motion: reduce)').matches){theme(n);return}
tbusy=true;const o=document.createElement('div');o.className='tov';o.style.background=n==='dark'?'#0b1226':'#ffffff';document.body.appendChild(o);
const raf2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
o.animate([{opacity:0},{opacity:1}],{duration:240,easing:'ease-in',fill:'forwards'}).finished
.then(()=>{theme(n);return raf2()})
.then(()=>o.animate([{opacity:1},{opacity:0}],{duration:320,easing:'ease-out',fill:'forwards'}).finished)
.catch(()=>theme(n)).finally(()=>{o.remove();tbusy=false})}
let th=null;try{th=localStorage.getItem('lae_theme')}catch(e){}
theme(th||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
function midnight(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n;setTimeout(()=>{if(cur&&view==='dash'&&tab==='dash')dash();midnight()},t+500)}
midnight();
load().then(render);
</script>
